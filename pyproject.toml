[project]
name = "fastsft"
version = "0.1.0"
description = "A CLI tool that distills a large LLM into a small one via synthetic-data generation, quality filtering, and fine-tuning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "distilabel[instructor,openai]>=1.5.3",
    "modal>=0.65.0",
    "pillow>=11.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich>=13.7.0",
    "transformers>=5.14.1",
]

[project.scripts]
fastsft = "fastsft.main:main"
fastsft-eval = "fastsft.eval.run:main"

[project.optional-dependencies]
# Only needed for `--local` (train on this machine instead of Modal):
# `uv sync --extra local-training`. Kept out of the main dependency list so
# Modal-only users keep a lean install. No `bitsandbytes` here -- it's
# CUDA-first and QLoRA locally is only supported when CUDA is detected.
local-training = ["torch", "peft", "trl", "accelerate"]

# Only needed to run the evaluation module (`python -m fastsft.eval.run`): local
# adapter/base inference (torch, peft, accelerate) plus sentence-transformers
# for the parent-similarity embeddings. Kept optional for the same reason as
# local-training -- `uv sync --extra evaluation`. No `trl` (no training here).
evaluation = ["torch", "peft", "accelerate", "sentence-transformers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastsft"]

[dependency-groups]
# ruff pinned below 0.17 so the lint baseline is reproducible (ruff adds/changes
# rules across minor releases); bump deliberately, re-running `ruff check .`.
# pytest drives the test suite (import guardrail + the growing unit tiers);
# pytest-cov reports which source lines/branches the tests actually exercised.
dev = ["ruff>=0.16.1,<0.17", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.ruff]
# Matches requires-python; drives the pyupgrade (UP) rewrites' target syntax.
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so the clean baseline doesn't depend on ruff's evolving
# defaults. E4/E7/E9 + F is ruff's default; the rest are opt-ins this repo is
# already clean against (isort, pyupgrade, bugbear, implicit-str-concat,
# datetime-tz). E501 (line length) is intentionally omitted.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ISC", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["fastsft"]
# The `datasets/` output directory collides with the third-party `datasets`
# library name, so ruff's filesystem detection misreads it as first-party.
known-third-party = ["datasets"]
# `fastsft.warnings_filter` has import-time side effects and must precede
# distilabel/transformers, so pin it to its own section ordered before all else.
section-order = ["sideeffects", "future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
sideeffects = ["fastsft.warnings_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/fastsft/ (tests/eval/ ~ fastsft/eval, etc.). importlib mode
# lets same-named files (test_config.py, test_constants.py) coexist across those
# mirrored dirs without __init__.py packaging.
addopts = "--import-mode=importlib"
# `live` marks Tier-4 tests that hit real OpenRouter / train locally; they are
# skipped unless `--run-live` (wired in tests/conftest.py). Registered here so
# `--strict-markers` stays happy and `pytest --markers` documents it.
markers = [
    "live: hits real external services (OpenRouter) or trains locally; skipped unless --run-live.",
]
# Coverage is opt-in (add --cov=fastsft) so the default run stays fast; the
# [tool.coverage] config below applies whenever it is requested.

[tool.coverage.run]
branch = true
source = ["fastsft"]
# modal_app's remote fn only runs on Modal's infra (exercised at the modal e2e
# step, not unit-testable here), so exclude it from the coverage denominator.
omit = ["*/modal_app.py"]

[tool.coverage.report]
show_missing = true
