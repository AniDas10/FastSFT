[project]
name = "llm-distillator"
version = "0.1.0"
description = "A CLI tool that distills a large LLM into a small one via synthetic-data generation, quality filtering, and fine-tuning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "distilabel[instructor,openai]>=1.5.3",
    "pillow>=11.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich>=13.7.0",
    "transformers>=5.14.1",
]
